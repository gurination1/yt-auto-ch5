name: Generate Short Video

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'    # Short #1
    - cron: '0 12 * * *'   # Short #2
    - cron: '0 21 * * *'  # Short #3

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      BROLL_SEGMENT_BUDGET_SECONDS: "180"
      JUDGE_MAX_ATTEMPTS: "3"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Tesseract OCR, Fonts, Rclone)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-liberation rclone

      - name: Install Bebas Neue Font
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo wget -O /usr/local/share/fonts/BebasNeue-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf
          sudo fc-cache -fv

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-base-v1
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -U --pre "yt-dlp[default]"

      - name: Generate Short
        timeout-minutes: 50
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:      ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:  ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:  ${{ secrets.YT_REFRESH_TOKEN }}
          COVERR_API_KEY:    ${{ secrets.COVERR_API_KEY }}
          NASA_API_KEY:      ${{ secrets.NASA_API_KEY }}
          KLIPY_API_KEY:     ${{ secrets.KLIPY_API_KEY }}
          GEMINI_API_KEYS:   ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_JUDGE_API_KEY: ${{ secrets.GEMINI_JUDGE_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          BYPASS_VISION_MATCH: "0"
          DISABLE_HYPERFRAMES: "1"
          DISABLE_YT_UPLOAD: "1"
          UPLOAD_PRIVACY: "private"
        run: |
          python run_generate.py --format short

      - name: Configure Rclone
        if: always()
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Upload Final Video ONLY to Rclone Google Drive
        if: always()
        run: |
          if [ -d output ] && [ -f output/final_short.mp4 ]; then
            echo "🚀 Uploading final video and metadata to gurination1:yt-auto-outputs..."
            rclone copy output/final_short.mp4 gurination1:yt-auto-outputs/${{ github.event.repository.name }}-run-${{ github.run_id }}/ --progress
            rclone copy output/thumbnail.jpg gurination1:yt-auto-outputs/${{ github.event.repository.name }}-run-${{ github.run_id }}/ --progress 2>/dev/null || true
            rclone copy output/metadata.json gurination1:yt-auto-outputs/${{ github.event.repository.name }}-run-${{ github.run_id }}/ --progress 2>/dev/null || true
            rclone copy output/script.json gurination1:yt-auto-outputs/${{ github.event.repository.name }}-run-${{ github.run_id }}/ --progress 2>/dev/null || true
            echo "✅ Rclone upload complete!"
          else
            echo "⚠️ No output/final_short.mp4 found to upload."
          fi

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/thumbnail.jpg
            output/metadata.json
            output/judge_report.json
            output/topic.json
            output/script.json
          retention-days: 7

      - name: Commit state files
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published_topics.json 2>/dev/null || true
          git add used_urls.json 2>/dev/null || true
          git add voice_state.json 2>/dev/null || true
          git add gemini_state.json 2>/dev/null || true
          git add thumbnail_state.json 2>/dev/null || true
          git add cache_music/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push || true
