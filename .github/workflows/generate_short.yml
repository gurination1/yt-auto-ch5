name: Generate Short Video

# Native GitHub Actions automated scheduling (100% cloud-hosted on GHA)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish video publicly to platforms (true/false)'
        required: false
        default: 'true'
  schedule:
    - cron: '0 3 * * *'    # 03:00 UTC / 08:30 IST (Ch5 Short #1)
    - cron: '30 10 * * *'  # 10:30 UTC / 16:00 IST (Ch5 Short #2)
    - cron: '0 18 * * *'   # 18:00 UTC / 23:30 IST (Ch5 Short #3)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: "1"
      CHANNEL_NICHE: "business"
      BROLL_SEGMENT_BUDGET_SECONDS: "180"
      JUDGE_MAX_ATTEMPTS: "3"

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space on Cloud Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Tesseract OCR, Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-liberation

      - name: Install Bebas Neue Font
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo wget -q -O /usr/local/share/fonts/BebasNeue-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf || true
          sudo wget -q -O /usr/local/share/fonts/Rajdhani-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/rajdhani/Rajdhani-Bold.ttf || true
          sudo wget -q -O /usr/local/share/fonts/BarlowCondensed-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf || true
          sudo wget -q -O /usr/local/share/fonts/Cinzel-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf" || true
          sudo wget -q -O /usr/local/share/fonts/Montserrat-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
          sudo fc-cache -fv

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-base-v1
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt && pip install -U --pre "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install and Start Cloudflare WARP (Bypass Cloud IP blocks for authentic documentary downloads)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor -o cloudflare-warp-archive-keyring.gpg
          sudo mv cloudflare-warp-archive-keyring.gpg /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cloudflare-warp
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos connect || true
          sleep 4
          warp-cli --accept-tos status || true
          curl -x socks5h://127.0.0.1:40000 -s https://cloudflare.com/cdn-cgi/trace | grep "warp=" || echo "WARP starting..."

      - name: Generate Short
        timeout-minutes: 75
        env:
          WARP_SOCKS_PROXY:  "socks5h://127.0.0.1:40000"
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:      ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:  ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:  ${{ secrets.YT_REFRESH_TOKEN }}
          COVERR_API_KEY:    ${{ secrets.COVERR_API_KEY }}
          NASA_API_KEY:      ${{ secrets.NASA_API_KEY }}
          KLIPY_API_KEY:     ${{ secrets.KLIPY_API_KEY }}
          GEMINI_API_KEYS:   ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_JUDGE_API_KEY: ${{ secrets.GEMINI_JUDGE_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          BYPASS_VISION_MATCH: "0"
          DISABLE_HYPERFRAMES: "1"
        run: |
          python run_generate.py --format short

      - name: Publish to 5 Platforms (YouTube, Dailymotion, Rumble, Meta, Threads)
        if: github.event.inputs.publish == 'true' || (github.event_name == 'schedule' && github.event.inputs.publish != 'false')
        timeout-minutes: 30
        env:
          PUBLISH_ENABLED:      ${{ github.event.inputs.publish || (github.event_name == 'schedule' && 'true' || 'false') }}
          YT_CLIENT_ID:         ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:     ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:     ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY:       "public"
          DM_API_KEY:          ${{ secrets.DM_API_KEY }}
          DM_API_SECRET:       ${{ secrets.DM_API_SECRET }}
          DM_USERNAME:         ${{ secrets.DM_USERNAME }}
          DM_PASSWORD:         ${{ secrets.DM_PASSWORD }}
          RUMBLE_EMAIL:         ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD:      ${{ secrets.RUMBLE_PASSWORD }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:        ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS:      ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_JUDGE_API_KEY: ${{ secrets.GEMINI_JUDGE_API_KEY }}
        run: |
          python run_publish.py

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/thumbnail.jpg
            output/metadata.json
            output/published_urls.json
            output/judge_report.json
            output/topic.json
            output/script.json
            output/*.jpg
          retention-days: 7


      - name: Commit state files
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published_topics.json 2>/dev/null || true
          git add used_urls.json 2>/dev/null || true
          git add voice_state.json 2>/dev/null || true
          git add gemini_state.json 2>/dev/null || true
          git add thumbnail_state.json 2>/dev/null || true
          git add cache_music/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git pull --rebase origin master 2>/dev/null || git pull --rebase origin main 2>/dev/null || true
          git push origin master 2>/dev/null || git push origin main 2>/dev/null || true
