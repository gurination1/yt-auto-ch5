name: Generate Short Video

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONUNBUFFERED: "1"
      CHANNEL_NICHE: "science"
      BROLL_SEGMENT_BUDGET_SECONDS: "120"
      JUDGE_MAX_ATTEMPTS: "6"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Tesseract OCR, Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-liberation

      - name: Install Bebas Neue Font
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo wget -O /usr/local/share/fonts/BebasNeue-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf
          sudo fc-cache -fv

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-base-v1
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -U --pre "yt-dlp[default]"

      - name: Generate Short
        timeout-minutes: 50
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:      ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:  ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:  ${{ secrets.YT_REFRESH_TOKEN }}
          COVERR_API_KEY:    ${{ secrets.COVERR_API_KEY }}
          NASA_API_KEY:      ${{ secrets.NASA_API_KEY }}
          KLIPY_API_KEY:     ${{ secrets.KLIPY_API_KEY }}
          GEMINI_API_KEYS:   ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_JUDGE_API_KEY: ${{ secrets.GEMINI_JUDGE_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          BYPASS_VISION_MATCH: "0"
          DISABLE_HYPERFRAMES: "1"
        run: |
          python run_generate.py --format short

      - name: Publish to 5 Platforms (YouTube, Dailymotion, Rumble, Meta, Threads)
        timeout-minutes: 30
        env:
          YT_CLIENT_ID:         ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:     ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:     ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY:       "public"
          DM_API_KEY:          ${{ secrets.DM_API_KEY }}
          DM_API_SECRET:       ${{ secrets.DM_API_SECRET }}
          DM_USERNAME:         ${{ secrets.DM_USERNAME }}
          DM_PASSWORD:         ${{ secrets.DM_PASSWORD }}
          RUMBLE_EMAIL:         ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD:      ${{ secrets.RUMBLE_PASSWORD }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:        ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS:      ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_JUDGE_API_KEY: ${{ secrets.GEMINI_JUDGE_API_KEY }}
        run: |
          python run_publish.py

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/thumbnail.jpg
            output/metadata.json
            output/judge_report.json
            output/topic.json
            output/script.json
          retention-days: 7

      - name: Upload to Rclone Cloud Drive
        if: always()
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            sudo apt-get install -y rclone
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            REMOTE=$(rclone listremotes | head -n 1)
            if [ -n "$REMOTE" ]; then
              echo "Uploading generated output to ${REMOTE}yt-auto-builds/${{ github.run_id }}/..."
              rclone copy output/ "${REMOTE}yt-auto-builds/${{ github.run_id }}/" -v || true
            fi
          fi

      - name: Commit state files
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published_topics.json 2>/dev/null || true
          git add used_urls.json 2>/dev/null || true
          git add voice_state.json 2>/dev/null || true
          git add gemini_state.json 2>/dev/null || true
          git add thumbnail_state.json 2>/dev/null || true
          git add cache_music/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push || true
